<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aqsuek</title>
    <meta name="description" content="aqsuek жобалары. Таңба — қазақша қаріптер." />
    <link rel="icon" href="/tanba/assets/tanba-mark.png" type="image/png"/>
    <style>
      :root {
        --bg: #07102a;
        --text: #f2f0e9;
        --muted: #9a9688;
        --line: rgba(242, 240, 233, 0.12);
        --accent: #4d7cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", "Noto Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main { width: min(640px, 100%); }
      p { color: var(--muted); line-height: 1.55; }
      a { color: inherit; text-decoration: none; }
      .brand {
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.2rem);
        letter-spacing: -0.04em;
        margin: 12px 0 24px;
      }
      .card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .card img {
        height: 28px;
        width: auto;
        display: block;
        background: #fff;
        padding: 8px 12px;
        border-radius: 10px;
      }
      .card span { color: var(--muted); font-size: 0.95rem; }
      .go { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">aqsuek.kz</p>
      <h1>Жобалар</h1>
      <a class="card" href="/tanba/">
        <div>
          <img src="/tanba/assets/tanba-logo.png" alt="Таңба"/>
          <span>Қазақша қаріптер каталогы</span>
        </div>
        <span class="go">ашу</span>
      </a>
    </main>
  </body>
</html>
